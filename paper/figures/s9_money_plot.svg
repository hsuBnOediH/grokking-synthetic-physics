<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380">
<rect width="600" height="380" fill="white"/>

<!-- Y-axis range: -2% (y=310) to 26% (y=30); scale = 10 px per 1% -->

<!-- Light grid lines at 5,10,15,20,25 % -->
<line x1="80" y1="240" x2="560" y2="240" stroke="#e8e8e8" stroke-width="1"/>
<line x1="80" y1="190" x2="560" y2="190" stroke="#e8e8e8" stroke-width="1"/>
<line x1="80" y1="140" x2="560" y2="140" stroke="#e8e8e8" stroke-width="1"/>
<line x1="80" y1="90"  x2="560" y2="90"  stroke="#e8e8e8" stroke-width="1"/>
<line x1="80" y1="40"  x2="560" y2="40"  stroke="#e8e8e8" stroke-width="1"/>

<!-- Zero reference line (slightly heavier so DCT cluster reads against it) -->
<line x1="80" y1="290" x2="560" y2="290" stroke="#888" stroke-width="1" stroke-dasharray="2,3"/>

<!-- Axes -->
<line x1="80" y1="30"  x2="80"  y2="312" stroke="#333" stroke-width="1.5"/>
<line x1="78" y1="310" x2="562" y2="310" stroke="#333" stroke-width="1.5"/>

<!-- Y-axis ticks and labels -->
<line x1="75" y1="290" x2="80" y2="290" stroke="#333" stroke-width="1"/>
<text x="70" y="294" text-anchor="end" fill="#444" font-family="Arial,sans-serif" font-size="12">0%</text>
<line x1="75" y1="240" x2="80" y2="240" stroke="#333" stroke-width="1"/>
<text x="70" y="244" text-anchor="end" fill="#444" font-family="Arial,sans-serif" font-size="12">5%</text>
<line x1="75" y1="190" x2="80" y2="190" stroke="#333" stroke-width="1"/>
<text x="70" y="194" text-anchor="end" fill="#444" font-family="Arial,sans-serif" font-size="12">10%</text>
<line x1="75" y1="140" x2="80" y2="140" stroke="#333" stroke-width="1"/>
<text x="70" y="144" text-anchor="end" fill="#444" font-family="Arial,sans-serif" font-size="12">15%</text>
<line x1="75" y1="90" x2="80" y2="90" stroke="#333" stroke-width="1"/>
<text x="70" y="94" text-anchor="end" fill="#444" font-family="Arial,sans-serif" font-size="12">20%</text>
<line x1="75" y1="40" x2="80" y2="40" stroke="#333" stroke-width="1"/>
<text x="70" y="44" text-anchor="end" fill="#444" font-family="Arial,sans-serif" font-size="12">25%</text>

<!-- Y-axis label -->
<text x="18" y="170" text-anchor="middle" fill="#333" font-family="Arial,sans-serif" font-size="13"
      transform="rotate(-90, 18, 170)">GGR (%)</text>

<!-- X-axis ticks and labels -->
<line x1="80"  y1="310" x2="80"  y2="315" stroke="#333" stroke-width="1"/>
<text x="80"  y="328" text-anchor="middle" fill="#444" font-family="Arial,sans-serif" font-size="12">2</text>
<line x1="160" y1="310" x2="160" y2="315" stroke="#333" stroke-width="1"/>
<text x="160" y="328" text-anchor="middle" fill="#444" font-family="Arial,sans-serif" font-size="12">4</text>
<line x1="240" y1="310" x2="240" y2="315" stroke="#333" stroke-width="1"/>
<text x="240" y="328" text-anchor="middle" fill="#444" font-family="Arial,sans-serif" font-size="12">8</text>
<line x1="320" y1="310" x2="320" y2="315" stroke="#333" stroke-width="1"/>
<text x="320" y="328" text-anchor="middle" fill="#444" font-family="Arial,sans-serif" font-size="12">16</text>
<line x1="400" y1="310" x2="400" y2="315" stroke="#333" stroke-width="1"/>
<text x="400" y="328" text-anchor="middle" fill="#444" font-family="Arial,sans-serif" font-size="12">32</text>
<line x1="480" y1="310" x2="480" y2="315" stroke="#333" stroke-width="1"/>
<text x="480" y="328" text-anchor="middle" fill="#444" font-family="Arial,sans-serif" font-size="12">64</text>
<line x1="560" y1="310" x2="560" y2="315" stroke="#333" stroke-width="1"/>
<text x="560" y="328" text-anchor="middle" fill="#444" font-family="Arial,sans-serif" font-size="12">128</text>

<!-- X-axis label -->
<text x="320" y="355" text-anchor="middle" fill="#333" font-family="Arial,sans-serif" font-size="13">Bottleneck width (n)</text>

<!-- DCT baseline (gray dashed) -->
<!-- y = 290 - GGR*10 ; GGRs: -0.14, -0.13, -0.51, +0.34, -0.57, -1.04, -1.29 -->
<!-- => 291.4, 291.3, 295.1, 286.6, 295.7, 300.4, 302.9 -->
<polyline points="80,291 160,291 240,295 320,287 400,296 480,300 560,303"
          fill="none" stroke="#888888" stroke-width="1.6" stroke-dasharray="5,4"/>
<!-- DCT data points (small grey diamonds) -->
<polygon points="80,287 84,291 80,295 76,291" fill="#888888"/>
<polygon points="160,287 164,291 160,295 156,291" fill="#888888"/>
<polygon points="240,291 244,295 240,299 236,295" fill="#888888"/>
<polygon points="320,283 324,287 320,291 316,287" fill="#888888"/>
<polygon points="400,292 404,296 400,300 396,296" fill="#888888"/>
<polygon points="480,296 484,300 480,304 476,300" fill="#888888"/>
<polygon points="560,299 564,303 560,307 556,303" fill="#888888"/>

<!-- ViT line (teal/green) -->
<!-- n=2,4,8,16,32,64,128: y = 290 - GGR*10 -->
<!-- 0.26→287.4, 0.48→285.2, 6.6→224, 7.2→218, 9.3→197, 10.2→188, 14.0→150 -->
<polyline points="80,287 160,285 240,224 320,218 400,197 480,188 560,150"
          fill="none" stroke="#00796b" stroke-width="2" stroke-linejoin="round"/>
<rect x="75"  y="282" width="10" height="10" fill="#00796b"/>
<rect x="155" y="280" width="10" height="10" fill="#00796b"/>
<rect x="235" y="219" width="10" height="10" fill="#00796b"/>
<rect x="315" y="213" width="10" height="10" fill="#00796b"/>
<rect x="395" y="192" width="10" height="10" fill="#00796b"/>
<rect x="475" y="183" width="10" height="10" fill="#00796b"/>
<rect x="555" y="145" width="10" height="10" fill="#00796b"/>

<!-- ConvNet line (blue) -->
<!-- n=2,4,8,16,32,64,128: y = 290 - GGR*10 -->
<!-- 3.6→254, 9.7→193, 11.1→179, 12.2→168, 25.5→35, 25.6→34, 24.5→45 -->
<polyline points="80,254 160,193 240,179 320,168 400,35 480,34 560,45"
          fill="none" stroke="#1565c0" stroke-width="2" stroke-linejoin="round"/>
<circle cx="80"  cy="254" r="5" fill="#1565c0"/>
<circle cx="160" cy="193" r="5" fill="#1565c0"/>
<circle cx="240" cy="179" r="5" fill="#1565c0"/>
<circle cx="320" cy="168" r="5" fill="#1565c0"/>
<circle cx="400" cy="35"  r="5" fill="#1565c0"/>
<circle cx="480" cy="34"  r="5" fill="#1565c0"/>
<circle cx="560" cy="45"  r="5" fill="#1565c0"/>

<!-- Legend -->
<rect x="100" y="48" width="200" height="78" rx="4" fill="white" stroke="#dddddd" stroke-width="1"/>
<!-- ConvNet legend -->
<line x1="112" y1="68" x2="142" y2="68" stroke="#1565c0" stroke-width="2"/>
<circle cx="127" cy="68" r="4" fill="#1565c0"/>
<text x="148" y="72" fill="#333" font-family="Arial,sans-serif" font-size="12">ConvNet (learned)</text>
<!-- ViT legend -->
<line x1="112" y1="88" x2="142" y2="88" stroke="#00796b" stroke-width="2"/>
<rect x="123" y="83" width="9" height="9" fill="#00796b"/>
<text x="148" y="92" fill="#333" font-family="Arial,sans-serif" font-size="12">ViT (learned)</text>
<!-- DCT legend -->
<line x1="112" y1="108" x2="142" y2="108" stroke="#888888" stroke-width="1.6" stroke-dasharray="5,4"/>
<polygon points="127,104 131,108 127,112 123,108" fill="#888888"/>
<text x="148" y="112" fill="#666" font-family="Arial,sans-serif" font-size="12">DCT (fixed)</text>

</svg>
