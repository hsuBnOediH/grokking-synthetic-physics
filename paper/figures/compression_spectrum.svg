<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" viewBox="0 0 700 240">
<rect width="700" height="240" fill="white"/>
<defs>
  <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffe3e3"/>
    <stop offset="100%" stop-color="#dce8ff"/>
  </linearGradient>
  <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#1a1a1a"/>
  </marker>
</defs>

<text x="350" y="28" text-anchor="middle" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Compression pressure</text>
<line x1="120" y1="48" x2="580" y2="48" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

<rect x="70" y="80" width="560" height="42" rx="5" fill="url(#spectrumGrad)" stroke="#888" stroke-width="1.5"/>

<line x1="70"  y1="80" x2="70"  y2="138" stroke="#444" stroke-width="2"/>
<line x1="182" y1="80" x2="182" y2="138" stroke="#888" stroke-width="1.2"/>
<line x1="294" y1="80" x2="294" y2="138" stroke="#888" stroke-width="1.2"/>
<line x1="406" y1="80" x2="406" y2="138" stroke="#888" stroke-width="1.2"/>
<line x1="518" y1="80" x2="518" y2="138" stroke="#888" stroke-width="1.2"/>
<line x1="630" y1="80" x2="630" y2="138" stroke="#444" stroke-width="2"/>

<!-- Row A (closer to bar): endpoints + every-other intermediate -->
<text x="70"  y="158" text-anchor="middle" fill="#c62828" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Memorization</text>
<text x="294" y="158" text-anchor="middle" fill="#333"    font-family="Arial,sans-serif" font-size="13">Prototypes</text>
<text x="518" y="158" text-anchor="middle" fill="#333"    font-family="Arial,sans-serif" font-size="13">Abstract rules</text>

<!-- Row B (further from bar): the rest -->
<text x="182" y="184" text-anchor="middle" fill="#333"    font-family="Arial,sans-serif" font-size="13">Case libraries</text>
<text x="406" y="184" text-anchor="middle" fill="#333"    font-family="Arial,sans-serif" font-size="13">Learned heuristics</text>
<text x="630" y="184" text-anchor="middle" fill="#1565c0" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Compressed rule</text>

<!-- Endpoint subtitles -->
<text x="70"  y="210" text-anchor="middle" fill="#666" font-family="Arial,sans-serif" font-size="11" font-style="italic">(lookup table)</text>
<text x="630" y="210" text-anchor="middle" fill="#666" font-family="Arial,sans-serif" font-size="11" font-style="italic">(closed-form / manifold)</text>

<!-- Bottom semantic anchors -->
<text x="70"  y="232" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="10" font-style="italic">stores every instance</text>
<text x="630" y="232" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="10" font-style="italic">stores the underlying law</text>
</svg>
